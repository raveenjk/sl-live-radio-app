<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get the App — Island Radio</title>
    <meta name="description" content="Download the Island Radio app for your device.">
    <link rel="stylesheet" href="../css/base.css">
    <style>
        .page {
            max-width: 540px;
            margin: 0 auto;
            padding: var(--sp-2xl) var(--sp-md);
            text-align: center;
            min-height: 80dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .page h1 {
            margin-bottom: var(--sp-sm);
        }

        .page p {
            color: var(--text-dim);
            margin-bottom: var(--sp-xl);
            max-width: 380px;
            line-height: 1.7;
        }

        .badge-row {
            display: flex;
            gap: var(--sp-md);
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: var(--sp-xl);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: var(--sp-sm);
            padding: .75rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            color: var(--text);
            font-weight: 600;
            transition: border-color var(--dur), background var(--dur);
        }

        .badge:hover {
            border-color: var(--text-dim);
            background: var(--raised);
            text-decoration: none;
        }

        .badge__sub {
            font-size: .7rem;
            color: var(--text-dim);
            font-weight: 400;
            display: block;
            text-align: left;
        }

        .badge__main {
            font-size: .9375rem;
            display: block;
            text-align: left;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: .375rem;
            color: var(--accent);
            font-size: .875rem;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>Get Island Radio</h1>
        <p>Take your favourite Sri Lankan stations everywhere. The app is coming soon.</p>

        <div class="badge-row">
            <a href="https://raveenjk.itch.io/island-radio" target="_blank" class="badge" aria-label="Download for Desktop on itch.io">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <div>
                    <span class="badge__sub">Available on</span>
                    <span class="badge__main">itch.io (Desktop)</span>
                </div>
            </a>
            <a href="#" class="badge" aria-label="Download on the App Store (coming soon)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79s-2 .76-3.29.81c-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z" />
                </svg>
                <div>
                    <span class="badge__sub">Coming soon on</span>
                    <span class="badge__main">App Store</span>
                </div>
            </a>
            <a href="#" class="badge" aria-label="Get it on Google Play (coming soon)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3.18 23.76c-.36-.17-.58-.53-.58-.93V1.17c0-.4.22-.76.58-.93l11.83 11.76L3.18 23.76zm1.5-22.15l9.47 9.47 2.59-2.59L5.11.96c-.37-.18-.73-.1-.93.01l.5.64zm0 20.78l-.5.64c.2.11.56.19.93.01l11.63-5.53-2.59-2.59-9.47 9.47zm10.55-10.55l3.02 3.02 3.56-1.69c.54-.26.54-.9 0-1.16l-3.56-1.69-3.02 3.02z" />
                </svg>
                <div>
                    <span class="badge__sub">Coming soon on</span>
                    <span class="badge__main">Google Play</span>
                </div>
            </a>
        </div>

        <a href="../index.html" class="back">← Listen on the web instead</a>
    </div>
</body>

</html>
